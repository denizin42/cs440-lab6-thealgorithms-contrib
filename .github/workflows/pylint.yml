name: Pylint, Pytest & CONTRIBUTING.md Checks

on:
  push:
    branches: ["main", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Harness & TDD Unit Tests (pytest)
      run: |
        pytest -v --tb=short
    - name: Analysing the code with pylint
      run: |
        python -m pylint --reports=n --score=y $(git ls-files '*.py')
    - name: Running doctests on target algorithms
      run: |
        python -m doctest -v maths/binomial_distribution.py
        python -m doctest -v maths/continued_fraction.py
        python -m doctest -v data_structures/linked_list/has_loop.py
